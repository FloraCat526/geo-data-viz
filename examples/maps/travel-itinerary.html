/** Geo Data Viz — MIT. MapLibre-native itinerary map layers; no routing or geocoding. */
const collection = features => ({type: 'FeatureCollection', features});
const idPattern = /^[A-Za-z][\w-]*$/;

function labelChip() {
  const canvas = document.createElement('canvas');
  canvas.width = 76; canvas.height = 56;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#dce5e9';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#18364b29';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.beginPath();
  ctx.moveTo(18, 5); ctx.lineTo(58, 5); ctx.quadraticCurveTo(71, 5, 71, 18);
  ctx.lineTo(71, 38); ctx.quadraticCurveTo(71, 51, 58, 51);
  ctx.lineTo(18, 51); ctx.quadraticCurveTo(5, 51, 5, 38);
  ctx.lineTo(5, 18); ctx.quadraticCurveTo(5, 5, 18, 5);
  ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.stroke();
  return ctx.getImageData(0, 0, 76, 56);

function coordinate(value) {
  if (!Array.isArray(value) || value.length !== 2 || !value.every(Number.isFinite) || Math.abs(value[0]) > 180 || Math.abs(value[1]) > 85) {
    throw new Error('Coordinates must be WGS84 [longitude, latitude] within MapLibre Mercator bounds');
  }

}

function shortText(value, field, max = 500) {
  if (value == null) return '';
  if (typeof value !== 'string' || value.length > max) throw new Error(`${field} must be text of at most ${max} characters`);
  return value.trim();
}

function color(value) {
  if (typeof value !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(value)) throw new Error('Day color must be #RRGGBB');
  return value;
}

/** Normalize only supplied values. Missing route geometry becomes an explicitly schematic connection. */
export function normalizeItinerary(input) {
  if (!input || !Array.isArray(input.days) || !input.days.length) throw new Error('Itinerary requires at least one day');
  const dayIds = new Set(), stopIds = new Set();
  const palette = ['#37699c', '#c57c48', '#657f70', '#a66d8c', '#7469a6'];
  const days = input.days.map((day, index) => {
    if (!day || typeof day !== 'object') throw new Error('Each day must be an object');
    const id = shortText(day.id ?? `day-${index + 1}`, 'day.id', 80);
    if (!idPattern.test(id) || dayIds.has(id)) throw new Error('Day IDs must be unique and URL-safe');
    dayIds.add(id);
    const label = shortText(day.label ?? `第 ${index + 1} 天`, 'day.label', 80);
    const date = shortText(day.date, 'day.date', 32);
    if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('day.date must be YYYY-MM-DD');
    if (!Array.isArray(day.stops)) throw new Error('day.stops must be an array');
    const stops = (day.stops ?? []).map((stop, stopIndex) => {
      if (!stop || typeof stop !== 'object') throw new Error('Each stop must be an object');
      const stopId = shortText(stop.id, 'stop.id', 80);
      if (!idPattern.test(stopId) || stopIds.has(stopId)) throw new Error('Stop IDs must be unique and URL-safe');
      stopIds.add(stopId);
      const name = shortText(stop.name, 'stop.name', 120);
      if (!name) throw new Error('Every stop needs a name');
      if (stop.details != null && !Array.isArray(stop.details)) throw new Error('stop.details must be an array');
      const details = (stop.details ?? []).map(item => ({
        label: shortText(item?.label, 'detail.label', 80),
        text: shortText(item?.text, 'detail.text', 500)
      })).filter(item => item.label && item.text);
      return {
        id: stopId, dayId: id, order: stopIndex + 1, name,
        coordinates: coordinate(stop.coordinates),
        time: shortText(stop.time, 'stop.time', 80),
        tag: shortText(stop.tag, 'stop.tag', 80),
        summary: shortText(stop.summary, 'stop.summary', 1000), details
      };
    });
    if (!stops.length) throw new Error('Each day needs at least one stop');
    let route = null;
    if (day.route != null) {
      if (day.route.type !== 'LineString' || !Array.isArray(day.route.coordinates) || day.route.coordinates.length < 2) throw new Error('day.route must be a LineString with at least two vertices');
      route = day.route.coordinates.map(coordinate);
      if (route.some((point, i) => i && Math.abs(point[0] - route[i - 1][0]) > 180)) throw new Error('Split paths at the antimeridian before displaying');
    }
    return {id, label, date, color: color(day.color ?? palette[index % palette.length]), stops,
      route, routeKind: route ? 'provided' : 'schematic'};
  });
  return {title: shortText(input.title ?? '旅行规划', 'title', 150), days};
}

export function itineraryGeoJSON(itinerary) {
  const stops = [], routes = [];
  const longitudes = itinerary.days.flatMap(day => day.stops.map(stop => stop.coordinates[0]));
  const midpoint = (Math.min(...longitudes) + Math.max(...longitudes)) / 2;
  for (const day of itinerary.days) {
    for (const stop of day.stops) stops.push({type: 'Feature', id: stop.id,
      properties: {id: stop.id, dayId: day.id, order: String(stop.order), name: stop.name, color: day.color,
        labelSide: stop.coordinates[0] <= midpoint ? 'west' : 'east'},
      geometry: {type: 'Point', coordinates: stop.coordinates}});
    const coordinates = day.route ?? day.stops.map(stop => stop.coordinates);
    if (coordinates.length > 1) routes.push({type: 'Feature', id: day.id,
      properties: {dayId: day.id, kind: day.routeKind, color: day.color},
      geometry: {type: 'LineString', coordinates}});
  }
  return {stops: collection(stops), routes: collection(routes)};
}

export class TravelItineraryLayer {
  constructor(map, {provider = 'maplibre', id = 'geo-itinerary', data, padding = {top: 110, right: 420, bottom: 90, left: 60}, onSelect = () => {}} = {}) {
    if (provider !== 'maplibre') throw new Error('Use the selected map provider’s native map layers');
    if (!map?.isStyleLoaded()) throw new Error('Create TravelItineraryLayer after MapLibre style load');
    if (!idPattern.test(id)) throw new Error('Invalid component ID');
    this.map = map; this.id = id; this.padding = padding; this.onSelect = onSelect;
    this.data = normalizeItinerary(data); this.dayId = null; this.stopId = null; this.destroyed = false;
    const geo = itineraryGeoJSON(this.data);
    this.sources = {routes: `${id}-routes`, stops: `${id}-stops`};
    this.labelImage = `${id}-name-chip`;
    this.layers = [`${id}-route-case`, `${id}-route-provided`, `${id}-route-schematic`, `${id}-stop-halo`, `${id}-stop-core`, `${id}-stop-label`, `${id}-stop-selected`, `${id}-stop-name`];
    if (Object.values(this.sources).some(source => map.getSource(source)) || this.layers.some(layer => map.getLayer(layer)) || map.hasImage(this.labelImage)) throw new Error('Component ID already exists');
    map.addImage(this.labelImage, labelChip(), {pixelRatio: 2, stretchX: [[24, 52]], stretchY: [[20, 36]], content: [17, 11, 59, 45]});
    map.addSource(this.sources.routes, {type: 'geojson', data: geo.routes});
    map.addSource(this.sources.stops, {type: 'geojson', data: geo.stops});
    const route = this.sources.routes, stops = this.sources.stops;
    map.addLayer({id: this.layers[0], type: 'line', source: route, paint: {'line-color': '#ffffff', 'line-width': 7, 'line-opacity': .88}, layout: {'line-cap': 'round', 'line-join': 'round'}});
    map.addLayer({id: this.layers[1], type: 'line', source: route, filter: ['==', ['get', 'kind'], 'provided'], paint: {'line-color': ['get', 'color'], 'line-width': 3.4}, layout: {'line-cap': 'round', 'line-join': 'round'}});
    map.addLayer({id: this.layers[2], type: 'line', source: route, filter: ['==', ['get', 'kind'], 'schematic'], paint: {'line-color': ['get', 'color'], 'line-width': 3, 'line-dasharray': [1.6, 1.35]}, layout: {'line-cap': 'round', 'line-join': 'round'}});
    map.addLayer({id: this.layers[3], type: 'circle', source: stops, paint: {'circle-radius': 16, 'circle-color': '#fff', 'circle-opacity': .94}});
    map.addLayer({id: this.layers[4], type: 'circle', source: stops, paint: {'circle-radius': 12.5, 'circle-color': ['get', 'color'], 'circle-stroke-width': 1, 'circle-stroke-color': '#fff'}});
    map.addLayer({id: this.layers[5], type: 'symbol', source: stops, layout: {'text-field': ['get', 'order'], 'text-size': 12, 'text-font': ['Noto Sans Regular'], 'text-allow-overlap': true}, paint: {'text-color': '#fff'}});
    map.addLayer({id: this.layers[6], type: 'circle', source: stops, filter: ['==', ['get', 'id'], ''], paint: {'circle-radius': 17, 'circle-color': '#fff', 'circle-opacity': 0, 'circle-stroke-color': '#173047', 'circle-stroke-width': 2.5}});
    map.addLayer({id: this.layers[7], type: 'symbol', source: stops,
      layout: {'text-field': ['get', 'name'], 'text-size': 12, 'text-font': ['Noto Sans Regular'],
        'icon-image': this.labelImage, 'icon-text-fit': 'both',
        'text-variable-anchor-offset': ['case', ['==', ['get', 'labelSide'], 'west'],
          ['literal', ['left', [2, 0], 'top', [0, 2], 'bottom', [0, 2], 'right', [2, 0]]],
          ['literal', ['right', [2, 0], 'top', [0, 2], 'bottom', [0, 2], 'left', [2, 0]]]],
        'text-justify': 'auto', 'text-padding': 4, 'text-max-width': 12},
      paint: {'text-color': '#203b50'}});
    this.click = event => {const hit = event.features?.[0]; if (hit) this.selectStop(hit.properties.id, {fly: false});};
    this.enter = () => {map.getCanvas().style.cursor = 'pointer';};
    this.leave = () => {map.getCanvas().style.cursor = '';};
    this.remove = () => this.destroy();
    for (const layer of [this.layers[4], this.layers[7]]) {
      map.on('click', layer, this.click); map.on('mouseenter', layer, this.enter); map.on('mouseleave', layer, this.leave);
    }
    map.on('remove', this.remove);
  }

  setDay(dayId = null, {fit = true} = {}) {
    if (this.destroyed) return;
    if (dayId !== null && !this.data.days.some(day => day.id === dayId)) throw new Error('Unknown itinerary day');
    this.dayId = dayId; this.stopId = null;
    const dayFilter = dayId === null ? ['all'] : ['==', ['get', 'dayId'], dayId];
    for (const layer of this.layers.slice(0, 6)) {
      const kind = layer === this.layers[1] ? 'provided' : layer === this.layers[2] ? 'schematic' : null;
      this.map.setFilter(layer, kind ? ['all', dayFilter, ['==', ['get', 'kind'], kind]] : dayFilter);
    }
    this.map.setFilter(this.layers[7], dayFilter);
    this.map.setFilter(this.layers[6], ['==', ['get', 'id'], '']);
    if (fit) this.fit();
  }

  fit() {
    if (this.destroyed) return;
    const days = this.dayId ? this.data.days.filter(day => day.id === this.dayId) : this.data.days;
    const coordinates = days.flatMap(day => [...day.stops.map(stop => stop.coordinates), ...(day.route ?? [])]);
    const lng = coordinates.map(p => p[0]), lat = coordinates.map(p => p[1]);
    const west = Math.min(...lng), east = Math.max(...lng), south = Math.min(...lat), north = Math.max(...lat);
    if (east - west > 180) throw new Error('Split itinerary at the antimeridian before fitting the map');
    if (west === east && south === north) this.map.easeTo({center: [west, south], zoom: 13, padding: this.padding, duration: 0});
    else this.map.fitBounds([[west, south], [east, north]], {padding: this.padding, maxZoom: this.dayId ? 14.3 : 13, duration: 500});
  }

  selectStop(stopId, {fly = true} = {}) {
    if (this.destroyed) return;
    const stop = this.data.days.flatMap(day => day.stops).find(item => item.id === stopId);
    if (!stop) throw new Error('Unknown itinerary stop');
    if (this.dayId && stop.dayId !== this.dayId) this.setDay(stop.dayId, {fit: false});
    this.stopId = stopId;
    this.map.setFilter(this.layers[6], ['==', ['get', 'id'], stopId]);
    if (fly) this.map.flyTo({center: stop.coordinates, zoom: Math.max(this.map.getZoom(), 12.8), duration: 650});
    this.onSelect(stop);
    return stop;
  }

  inspect() {
    return {provider: 'maplibre', rendererOwner: 'provider-native', types: ['line', 'circle', 'symbol'], days: this.data.days.length,
      stops: this.data.days.reduce((sum, day) => sum + day.stops.length, 0), providedRoutes: this.data.days.filter(day => day.route).length,
      schematicRoutes: this.data.days.filter(day => !day.route && day.stops.length > 1).length, selectedDay: this.dayId, selectedStop: this.stopId};
  }

  destroy() {
    if (this.destroyed) return;
    this.destroyed = true;
    for (const layer of [this.layers[4], this.layers[7]]) {
      this.map.off('click', layer, this.click); this.map.off('mouseenter', layer, this.enter); this.map.off('mouseleave', layer, this.leave);
    }
    this.map.off('remove', this.remove);
    for (const layer of [...this.layers].reverse()) if (this.map.getLayer(layer)) this.map.removeLayer(layer);
    for (const source of Object.values(this.sources)) if (this.map.getSource(source)) this.map.removeSource(source);
    if (this.map.hasImage(this.labelImage)) this.map.removeImage(this.labelImage);
  }
}

}
function basemapNativeImageryStyle(style,provider){
 if(provider==='mapbox'&&['satellite-v9','satellite-streets-v12'].some(name=>style==='mapbox:'+'//styles/mapbox/'+name))return true;
 const url=new URL(style);return url.protocol==='https:'&&url.hostname==='api.maptiler.com'&&url.pathname==='/maps/satellite/style.json'&&!!url.searchParams.get('key');
}
function basemapSource(raw,{terrain=false,provider}={}){
 const keys=['url','tiles','tileSize','attribution','minzoom','maxzoom',...(terrain?['encoding','exaggeration']:[])];
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||Object.keys(raw).some(key=>!keys.includes(key)))basemapFail('source has unknown fields');
 if(Object.hasOwn(raw,'url')===Object.hasOwn(raw,'tiles'))basemapFail('provide exactly one source URL or tiles array');
 const result={...raw};
 if(Object.hasOwn(raw,'url'))basemapUrl(raw.url,{mapbox:provider==='mapbox'});
 else{if(!Array.isArray(raw.tiles)||raw.tiles.length<1||raw.tiles.length>8)basemapFail('tiles must contain one to eight HTTPS XYZ templates');result.tiles=raw.tiles.map(url=>basemapUrl(url,{tiles:true}));}
 if(![256,512,514].includes(raw.tileSize??256))basemapFail('tileSize must match the source: 256, 512, or 514');
 result.tileSize=raw.tileSize??256;result.attribution=basemapAttribution(raw.attribution);
 for(const key of ['minzoom','maxzoom'])if(Object.hasOwn(raw,key)&&(!Number.isInteger(raw[key])||raw[key]<0||raw[key]>24))basemapFail('source zoom levels must be integers from 0 to 24');
 if((raw.minzoom??0)>(raw.maxzoom??24))basemapFail('minzoom must not exceed maxzoom');
 if(terrain){const encoding=raw.encoding??'mapbox',exaggeration=raw.exaggeration??1.5;if(!['mapbox','terrarium'].includes(encoding)||provider==='mapbox'&&encoding!=='mapbox')basemapFail('DEM encoding must be mapbox or terrarium');if(provider==='mapbox'&&raw.url!=='mapbox:'+'//mapbox.mapbox-terrain-dem-v1')basemapFail('Mapbox terrain requires the supported Terrain-DEM tileset');if(typeof exaggeration!=='number'||!Number.isFinite(exaggeration)||exaggeration<=0||exaggeration>10)basemapFail('terrain exaggeration must be greater than 0 and up to 10');Object.assign(result,{encoding,exaggeration});}
 return result;
}

export function normalizeBasemap(config,{provider='maplibre',theme='dark'}={}){
 if(!['maplibre','mapbox','maptiler'].includes(provider)||!['dark','light'].includes(theme))basemapFail('unsupported provider or theme');
 config=config??{};
 if(typeof config!=='object'||Array.isArray(config)||Object.keys(config).some(key=>!['type','styleUrl','imagery','terrain','showHillshade'].includes(key)))basemapFail('configuration has unknown fields');
 const type=config.type??'vector';if(!['vector','imagery','terrain'].includes(type))basemapFail('type must be vector, imagery, or terrain');
 if(type==='vector'&&['imagery','terrain','showHillshade'].some(key=>Object.hasOwn(config,key)))basemapFail('vector does not accept imagery or terrain options');
 if(type==='imagery'&&['terrain','showHillshade'].some(key=>Object.hasOwn(config,key)))basemapFail('use type terrain to combine imagery and elevation');
 if(Object.hasOwn(config,'showHillshade')&&typeof config.showHillshade!=='boolean')basemapFail('showHillshade must be boolean');
 let styleUrl=config.styleUrl;
 if(styleUrl===undefined){if(provider==='maptiler')basemapFail('MapTiler requires an explicit authorized styleUrl');styleUrl=provider==='mapbox'?'mapbox:'+'//styles/mapbox/'+(type==='imagery'?'satellite-streets-v12':type==='terrain'?'outdoors-v12':`${theme}-v11`):'https://tiles.openfreemap.org/styles/'+(theme==='light'?'positron':'dark');}
 basemapUrl(styleUrl,{mapbox:provider==='mapbox'});const result={type,styleUrl};
 if(Object.hasOwn(config,'imagery'))result.imagery=basemapSource(config.imagery,{provider});
 else if(type==='imagery'&&!basemapNativeImageryStyle(styleUrl,provider))basemapFail('imagery requires an attributed tile source; vector styles are not satellite imagery');
 if(type==='terrain'){const source=config.terrain??(provider==='mapbox'?{url:'mapbox:'+'//mapbox.mapbox-terrain-dem-v1',tileSize:512,encoding:'mapbox',attribution:'© Mapbox',exaggeration:1.5}:null);result.terrain=basemapSource(source,{terrain:true,provider});result.showHillshade=config.showHillshade??false;}
 return result;
}

/** Register native imagery/DEM layers without replacing the map style or business data.
 * Initialize new Map({style: normalizeBasemap(...).styleUrl}) before applying.
 * ready resolves after registration, not tile loading; video capture must await map idle.
 */
export function applyBasemap(map,config,{provider='maplibre',theme='dark',id='geo-basemap'}={}){
 const normalized=normalizeBasemap(config,{provider,theme});
 if(!map||typeof map.addSource!=='function'||typeof map.addLayer!=='function'||typeof map.on!=='function')basemapFail('a native GL map instance is required');
 if(typeof id!=='string'||!/^\w[\w-]*$/.test(id))basemapFail('id must contain only letters, digits, underscores, and hyphens');
 let owners=basemapOwners.get(map);if(!owners){owners=new Map();basemapOwners.set(map,owners);}if(owners.has(id))basemapFail('id already belongs to another basemap controller');
 const ids={imagery:`${id}-imagery`,raster:`${id}-raster`,dem:`${id}-dem`,hillshadeSource:`${id}-hillshade-dem`,hillshade:`${id}-hillshade`};
 const sources=new Map(),layers=new Map();let disposed=false,registered=false,installing=false,error=null,timer,settled=false,resolveReady,rejectReady;
 const ready=new Promise((resolve,reject)=>{resolveReady=resolve;rejectReady=reject;});
 // Consumers may inspect asynchronous errors instead of awaiting ready; avoid an unhandled rejection.
 ready.catch(()=>{});
 const finish=err=>{if(settled)return;settled=true;clearTimeout(timer);err?rejectReady(err):resolveReady(controller);};
 const source=(key,spec)=>{const current=map.getSource(key);if(current){if(sources.get(key)!==current)basemapFail(`source id collision: ${key}`);return;}map.addSource(key,spec);sources.set(key,map.getSource(key));};
 const before=()=>{const style=map.getStyle();return style.layers?.find(layer=>layer.type==='symbol'||layer.type==='custom'||['geojson','canvas','video','image'].includes(style.sources?.[layer.source]?.type))?.id;};
 const ownsLayer=key=>{const current=map.getLayer(key),owned=layers.get(key);return !!current&&!!owned&&current.type===owned.type&&current.source===owned.source&&sources.get(owned.source)===map.getSource(owned.source);};
 const layer=(key,spec)=>{if(map.getLayer(key)){if(!ownsLayer(key))basemapFail(`layer id collision: ${key}`);return;}map.addLayer({id:key,...spec},before());layers.set(key,{type:spec.type,source:spec.source});};
 const demSpec=()=>{const {exaggeration,...definition}=normalized.terrain;return {type:'raster-dem',...definition};};
 const ownsResources=()=>[...sources].every(([key,owned])=>owned===map.getSource(key))&&[...layers.keys()].every(ownsLayer);
 const terrainReady=()=>!normalized.terrain||(map.getTerrain?.()?.source===ids.dem&&map.getTerrain?.()?.exaggeration===normalized.terrain.exaggeration);
 const events=['style.load','load','styledata','sourcedata','idle'];
 function register(){if(disposed||installing||!map.isStyleLoaded())return;if(registered&&ownsResources()&&terrainReady())return;installing=true;try{
  if(normalized.terrain){const projection=map.getProjection?.()?.type??'mercator';if(provider!=='mapbox'&&projection!=='mercator'||provider==='mapbox'&&!['mercator','globe'].includes(projection))basemapFail('terrain requires a supported geographic projection (MapLibre/MapTiler: mercator; Mapbox: mercator or globe)');}
  if(normalized.imagery){source(ids.imagery,{type:'raster',...normalized.imagery});layer(ids.raster,{type:'raster',source:ids.imagery,paint:{'raster-opacity':1,'raster-fade-duration':0}});}
  if(normalized.terrain){source(ids.dem,demSpec());map.setTerrain({source:ids.dem,exaggeration:normalized.terrain.exaggeration});if(normalized.showHillshade){source(ids.hillshadeSource,demSpec());layer(ids.hillshade,{type:'hillshade',source:ids.hillshadeSource,paint:{'hillshade-exaggeration':.4}});}}
  registered=true;error=null;finish();
 }catch(err){registered=false;error=err;finish(err);}finally{installing=false;}}
 const controller={config:normalized,ready,inspect(){return {type:normalized.type,styleUrl:normalized.styleUrl,registered:!disposed&&registered&&ownsResources()&&terrainReady(),imagery:normalized.type==='imagery'||!!normalized.imagery,terrain:!!normalized.terrain,showHillshade:normalized.showHillshade??false,error:error?.message??null};},destroy(){if(disposed)return;disposed=true;clearTimeout(timer);for(const event of events)map.off(event,register);if(!settled)finish(Error('Basemap disposed before its style became ready'));try{if(map.getTerrain?.()?.source===ids.dem&&sources.get(ids.dem)===map.getSource(ids.dem))map.setTerrain(null);for(const key of [...layers.keys()].reverse())if(ownsLayer(key))map.removeLayer(key);for(const [key,owned] of [...sources].reverse())if(map.getSource(key)===owned)map.removeSource(key);}finally{owners.delete(id);registered=false;}}};
 owners.set(id,controller);for(const event of events)map.on(event,register);timer=setTimeout(()=>{error=Error('Basemap style did not become ready');finish(error);},20000);register();return controller;
}

// Constructors that require a loaded style can await TileJSON/source initialization.
// This is not a complete tilesLoaded/idle test for screenshots or video capture.
export function waitForBasemapStyle(map,{timeoutMs=20000}={}){
 if(map.isStyleLoaded())return Promise.resolve();
 return new Promise((resolve,reject)=>{let timer;const events=['idle','sourcedata','styledata'],cleanup=()=>{clearTimeout(timer);for(const event of events)map.off(event,check);},check=()=>{if(map.isStyleLoaded()){cleanup();resolve();}};timer=setTimeout(()=>{cleanup();reject(Error('Basemap resources did not become ready'));},timeoutMs);for(const event of events)map.on(event,check);check();});
}

const basemapConfig={"type": "vector", "styleUrl": "https://tiles.openfreemap.org/styles/positron"};
const raw=JSON.parse(document.getElementById('itinerary-data').textContent),$=id=>document.getElementById(id);
let map,journey,popup,basemapController;
function text(tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el;}
function showPopup(stop){popup?.remove();const body=document.createElement('div');body.className='popup';const day=journey.data.days.find(item=>item.id===stop.dayId);body.style.setProperty('--stop-accent',day?.color??'#37699c');const top=document.createElement('div');top.className='popup-top';top.append(text('span',`${day?.label??'行程'} · 第 ${stop.order} 站`,'step'));if(stop.tag)top.append(text('span',stop.tag,'tag'));body.append(top,text('h3',stop.name));if(stop.time)body.append(text('span',stop.time,'time'));if(stop.summary)body.append(text('p',stop.summary));if(stop.details.length){const list=document.createElement('dl');for(const item of stop.details){const row=document.createElement('div');row.append(text('dt',item.label),text('dd',item.text));list.append(row);}body.append(list);}popup=new maplibregl.Popup({offset:22,maxWidth:'340px'}).setLngLat(stop.coordinates).setDOMContent(body).addTo(map);render();}
function render(){const data=journey.data,selected=data.days.find(day=>day.id===journey.dayId),days=data.days,stopCount=days.reduce((n,day)=>n+day.stops.length,0);$('title').textContent=data.title;$('count').textContent=selected?`${selected.date?selected.date+' · ':''}${selected.stops.length} 个地点`:`${days.length} 天 · ${stopCount} 个地点`;
 $('tabs').replaceChildren();for(const day of [null,...days]){const button=text('button',day?.label??'总览');button.type='button';button.role='tab';button.setAttribute('aria-selected',String(journey.dayId===(day?.id??null)));button.onclick=()=>{popup?.remove();journey.setDay(day?.id??null);render();};$('tabs').append(button);}
 $('list').replaceChildren();
 if(!selected){for(const day of days){const button=document.createElement('button');button.className='day-card';button.type='button';const swatch=text('span','', 'swatch');swatch.style.background=day.color;const body=document.createElement('span');body.append(text('strong',day.label+(day.date?' · '+day.date:'')),text('small',`${day.stops.length} 站 · ${day.stops[0].name} → ${day.stops.at(-1).name}`));button.append(swatch,body,text('span','›','arrow'));button.onclick=()=>{journey.setDay(day.id);render();};$('list').append(button);}}
 else for(const stop of selected.stops){const button=document.createElement('button');button.className='stop'+(journey.stopId===stop.id?' active':'');button.type='button';button.style.setProperty('--day-color',selected.color);button.append(text('span',String(stop.order),'num'));const body=document.createElement('span');body.append(text('strong',stop.name));if(stop.tag||stop.summary)body.append(text('small',stop.tag||stop.summary));button.append(body);if(stop.time)button.append(text('span',stop.time,'when'));button.onclick=()=>journey.selectStop(stop.id);$('list').append(button);}
 const schematic=(selected?[selected]:days).some(day=>day.routeKind==='schematic'&&day.stops.length>1);$('note').textContent=schematic?'虚线仅示顺序，非实际道路':'';$('status').textContent='';}
function fitPadding(){return innerWidth<=760?{top:70,right:100,bottom:Math.min(innerHeight*.43,365)+96,left:100}:{top:70,right:400,bottom:70,left:60};}
function onResize(){if(!journey)return;journey.padding=fitPadding();map.resize();journey.fit();}
try{
 const data=normalizeItinerary(raw);
 map=new maplibregl.Map({container:'map',style:basemapConfig.styleUrl,center:data.days[0].stops[0].coordinates,zoom:10,attributionControl:{compact:true}});
 map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
 // MapLibre's compact control starts expanded until the first map movement.
 const collapseAttribution=()=>{const attribution=map.getContainer().querySelector('details.maplibregl-ctrl-attrib');if(attribution){attribution.open=false;attribution.classList.remove('maplibregl-compact-show');}document.body.classList.remove('map-loading');};
 map.on('error',()=>{if(document.body.classList.contains('map-loading'))collapseAttribution();$('status').textContent='地图资源加载失败，请检查网络后刷新。';});
 map.on('load',async()=>{try{basemapController=applyBasemap(map,basemapConfig,{theme:'light'});await basemapController.ready;await waitForBasemapStyle(map);if(basemapConfig.type==='terrain')map.setPitch(50);journey=new TravelItineraryLayer(map,{data,padding:fitPadding(),onSelect:showPopup});if(innerWidth<=760)journey.setDay(data.days[0].id,{fit:false});journey.fit();render();collapseAttribution();}catch(error){$('status').textContent='行程无法显示：'+error.message;}});
 window.addEventListener('resize',onResize);
 window.addEventListener('pagehide',()=>{window.removeEventListener('resize',onResize);popup?.remove();journey?.destroy();basemapController?.destroy();map?.remove();},{once:true});
}catch(error){$('status').textContent='行程数据不完整：'+error.message;}
</script></body></html>
