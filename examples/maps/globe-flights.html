export function normalizeGlobeFlights(input) {

class GlobeLayer {

const ROUTE_COLORS={Asia:'#f8c96b',Europe:'#a898ff',Africa:'#62d9c1',Oceania:'#58c9f5',Americas:'#fa8caa',Other:'#b6c7d8'};

export class GlobeChoroplethLayer extends GlobeLayer {
